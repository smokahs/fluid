modLoader="javafml"
loaderVersion="${forge_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="smokahs"
description='''
Puts every mod's molten metals on one fluid unit and one fluid. Amounts are normalised before
recipes are deserialised, so melting an ingot in one mod and casting it in another can no longer
duplicate or eat metal. Has no hard dependencies: it works on whatever molten fluids are present.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"

# every bridged mod is optional and only ordered, so a pack can drop any of them.

[[dependencies.${mod_id}]]
    modId="gtceu"
    mandatory=false
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tconstruct"
    mandatory=false
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="createmetallurgy"
    mandatory=false
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tinkersmetallurgy"
    mandatory=false
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tic3nh"
    mandatory=false
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"
